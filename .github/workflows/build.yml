name: Build Lightning Tile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/example/lightningtile

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Lightning-Tile"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.9.1" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.example.lightningtile"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.example.lightningtile"
                  minSdk = 30
                  targetSdk = 30
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="Lightning Tile"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault">

                  <service
                      android:name=".LightningTileService"
                      android:exported="true"
                      android:icon="@android:drawable/ic_menu_view"
                      android:label="Lightning"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/lightningtile/LightningTileService.java <<'EOF'
          package com.example.lightningtile;

          import android.content.pm.PackageManager;
          import android.service.quicksettings.Tile;
          import android.service.quicksettings.TileService;

          import rikka.shizuku.Shizuku;

          public class LightningTileService extends TileService {

              @Override
              public void onStartListening() {
                  super.onStartListening();

                  Tile tile = getQsTile();
                  if (tile != null) {
                      tile.setLabel("Lightning");
                      tile.setState(Tile.STATE_INACTIVE);
                      tile.updateTile();
                  }
              }

              @Override
              public void onClick() {
                  super.onClick();

                  if (!Shizuku.pingBinder()) {
                      return;
                  }

                  if (Shizuku.checkSelfPermission()
                          != PackageManager.PERMISSION_GRANTED) {
                      return;
                  }

                  try {
                      String[] command = {
                          "sh",
                          "-c",
                          "service call activity_task 178"
                      };

                      Shizuku.newProcess(command, null, null);
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lightning-Tile-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
